name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrations grant their tables and stay closed to signed-out visitors
        run: |
          python3 scripts/test-check-migration-security.py
          python3 scripts/check-migration-security.py
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Shared packages install and load as Studio will (packed, installed, require() and import)
        run: |
          node --test scripts/test-publish-packages.mjs
          node scripts/publish-packages.mjs --check
      - name: Bundle Vantage for Android
        working-directory: apps/vantage
        run: npx expo export --platform android --output-dir ../../dist/vantage
        env:
          CI: 1
          EXPO_OFFLINE: 1
      - name: Bundle Vision for web
        working-directory: apps/vision
        run: npx expo export --platform web --output-dir ../../dist/vision
        env:
          CI: 1
          EXPO_OFFLINE: 1
