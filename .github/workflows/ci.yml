name: CI

# Pull requests only, not main again after a merge, to save Actions minutes
# (Matt, 20 November 2026): the run tests the pull request merged with main.
# To check main, run it by hand (Actions > CI > Run workflow). To go back, add
# `push: branches: [main]` again.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Migrations grant their tables and stay closed to signed-out visitors
        run: |
          python3 scripts/test-check-migration-security.py
          python3 scripts/check-migration-security.py
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Test the npm packages as they would be published
        run: scripts/test-packages.sh
      - name: Pack the Stream Deck plugin
        run: pnpm --filter @firstpass/vantage-deck run validate && pnpm --filter @firstpass/vantage-deck run pack
      - uses: actions/upload-artifact@v7
        with:
          name: Stream Deck plugin
          path: plugins/vantage-deck/dist/*.streamDeckPlugin
          if-no-files-found: error
          retention-days: 30
      - name: Bundle Vantage for Android
        working-directory: apps/vantage
        run: npx expo export --platform android --output-dir ../../dist/vantage
        env:
          CI: 1
          EXPO_OFFLINE: 1
      - name: Bundle Vision for web
        working-directory: apps/vision
        run: npx expo export --platform web --output-dir ../../dist/vision
        env:
          CI: 1
          EXPO_OFFLINE: 1
