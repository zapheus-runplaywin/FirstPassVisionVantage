name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Bundle Vantage for Android
        working-directory: apps/vantage
        run: npx expo export --platform android --output-dir ../../dist/vantage
        env:
          CI: 1
          EXPO_OFFLINE: 1
      - name: Bundle Vision for web
        working-directory: apps/vision
        run: npx expo export --platform web --output-dir ../../dist/vision
        env:
          CI: 1
          EXPO_OFFLINE: 1
