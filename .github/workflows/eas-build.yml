name: EAS build

# Start a cloud build on Expo Application Services.
# Needs the repository secret EXPO_TOKEN (an Expo access token).
on:
  workflow_dispatch:
    inputs:
      app:
        description: App to build
        type: choice
        options: [vantage, vision]
        default: vantage
      platform:
        description: Platform
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: Build profile (preview = installable test build)
        type: choice
        options: [preview, development, production]
        default: preview

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Link the app to its Expo project
        working-directory: apps/${{ inputs.app }}
        # Creates the Expo project on the first run and links to it after that.
        run: eas init --non-interactive --force
      - name: Start the build
        working-directory: apps/${{ inputs.app }}
        run: |
          eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait --json > build.json
          cat build.json
          node -e '
            const builds = require("./build.json");
            const lines = builds.map(b => `- ${b.platform}: https://expo.dev/accounts/${b.app?.ownerAccount?.name}/projects/${b.app?.slug}/builds/${b.id}`);
            console.log(["### EAS build started", "", ...lines].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
