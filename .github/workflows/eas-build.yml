name: EAS build

# Start a cloud build on Expo Application Services.
# Needs the repository secret EXPO_TOKEN (an Expo access token).
on:
  workflow_dispatch:
    inputs:
      app:
        description: App to build
        type: choice
        options: [vantage, vision]
        default: vantage
      platform:
        description: Platform
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: Build profile (preview = installable test build)
        type: choice
        options: [preview, development, production]
        default: preview
      submit:
        description: Send to testers (production profile only; Android to Google Play internal testing, iOS to TestFlight)
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Link the app to its Expo project
        working-directory: apps/${{ inputs.app }}
        # Creates the Expo project on the first run and links to it after that.
        run: eas init --non-interactive --force
      - name: Check the upload settings
        if: inputs.submit && inputs.profile != 'production'
        run: |
          echo "::error::Sending to Google Play or TestFlight needs the production profile."
          exit 1
      - name: Check the app has its App Store Connect number
        if: inputs.submit && inputs.platform != 'android'
        working-directory: apps/${{ inputs.app }}
        # Without it EAS stops to ask a question nobody can answer here. See docs/testflight.md.
        run: |
          node -e '
            const id = require("./eas.json").submit?.production?.ios?.ascAppId;
            if (!/^\d+$/.test(id ?? "")) {
              console.log("::error::apps/${{ inputs.app }}/eas.json has no submit.production.ios.ascAppId yet. Make the first iOS build from a computer (docs/testflight.md), then add the number.");
              process.exit(1);
            }
          '
      - name: Start the build
        working-directory: apps/${{ inputs.app }}
        run: |
          eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} ${{ inputs.submit && '--auto-submit' || '' }} --non-interactive --no-wait --json > build.json
          cat build.json
          node -e '
            const builds = require("./build.json");
            const lines = builds.map(b => `- ${b.platform}: https://expo.dev/accounts/${b.app?.ownerAccount?.name}/projects/${b.app?.slug}/builds/${b.id}`);
            console.log(["### EAS build started", "", ...lines].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
